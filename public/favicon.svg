<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="reyraGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#E5B94E" />
      <stop offset="50%" stop-color="#C89626" />
      <stop offset="75%" stop-color="#F5DB7B" />
      <stop offset="100%" stop-color="#9C6B10" />
    </linearGradient>

    <linearGradient id="reyraGoldColumn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B74B" />
      <stop offset="35%" stop-color="#FFF4B8" />
      <stop offset="70%" stop-color="#C99729" />
      <stop offset="100%" stop-color="#8C5C05" />
    </linearGradient>

    <linearGradient id="reyraGoldLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8DE85" />
      <stop offset="40%" stop-color="#FDEAA1" />
      <stop offset="75%" stop-color="#C69528" />
      <stop offset="100%" stop-color="#8F5E07" />
    </linearGradient>

    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Emerald Luxury Square Canvas with Rounded Corners -->
  <rect width="120" height="120" rx="24" fill="#072e22" />
  <rect x="3" y="3" width="114" height="114" rx="21" fill="none" stroke="#0d4a37" stroke-width="1.5" />

  <!-- Iconic REYRA Architectural Gold Monogram 'R' -->
  <g filter="url(#goldGlow)">
    <!-- Top and Bottom Column Caps (Classical Serif Architecture) -->
    <rect x="22" y="24" width="22" height="4.5" rx="1" fill="url(#reyraGoldPrimary)" />
    <rect x="22" y="93" width="22" height="4.5" rx="1" fill="url(#reyraGoldPrimary)" />
    
    <!-- Stately Vertical Stem -->
    <rect x="28" y="27" width="9.5" height="68" rx="0.5" fill="url(#reyraGoldColumn)" />
    
    <!-- Sculptural Loop of the 'R' -->
    <path
      d="M 37.5 28.5 L 68 28.5 C 84 28.5 94 37 94 49 C 94 61 84 69.5 68 69.5 L 37.5 69.5 Z"
      fill="none"
      stroke="url(#reyraGoldLoop)"
      stroke-width="8.5"
      stroke-linejoin="miter"
    />
    
    <!-- Architectural Diagonal Leg & Base Serif -->
    <path d="M 58 66 L 85 94 L 97 94 L 69 66 Z" fill="url(#reyraGoldPrimary)" />
    <rect x="78" y="93" width="22" height="4.5" rx="1" fill="url(#reyraGoldPrimary)" />
  </g>
</svg>
